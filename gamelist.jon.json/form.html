<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<form action="index.php" method="POST" enctype="multipart/form-data">
<br><br>
        <label for="username">First name:</label>
        <input type="text" id="fname" placeholder="first" required><br><br>
      
      <label for="username">Last name:</label>
        <input type="text" id="lname" placeholder="last" required><br><br>

        <label for="email">email:</label>
        <input type="email" id="email"><br><br>


        <label for="phone">phone #:</label>
        <input type="tel" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br><br>

        <label for="bday">birthdate:</label>
        <input type="date" id="bday"><br><br>

        <label for="quantity">quantity:</label>
        <input type="number" id="quantity" min="0" max="99" value="1"><br><br>

        <label for="payment">payment</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="mastercard">mastercard</option>
            <option value="giftcard">giftcard</option>
        </select><br><br>

        <label for="subscribe">subscribe:</label>
        <input type="checkbox" id="subscribe"><br><br>

        <label for="comment">comment:</label>
        <textarea id="comment" rows="3" cols="25"></textarea><br><br>

        <input type="reset"><br><br>
        <input id="submit"type="submit">
<br><br>
    </form>

    
</body>
</html>
